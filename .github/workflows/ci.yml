name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  schema-sync:
    name: Prisma schema sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/sync-schema.sh

  web:
    name: web — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma client
        working-directory: web
        run: npx prisma generate
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build

  scanner:
    name: scanner — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - name: Install dependencies
        working-directory: scanner
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma client
        working-directory: scanner
        run: npx prisma generate
      - name: Typecheck
        working-directory: scanner
        run: npx tsc --noEmit

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build web + scanner images
        run: docker compose build loom-web loom-scanner
