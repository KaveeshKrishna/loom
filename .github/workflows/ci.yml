name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  schema-sync:
    name: Prisma schema sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/sync-schema.sh

  shellcheck:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd scripts && shellcheck -x *.sh ../scanner/docker-entrypoint.sh ../web/docker-entrypoint.sh
      - run: shellcheck -x tests/stack/stack.sh tests/run-e2e.sh clients/desktop/ui-tests/run.sh

  migrations:
    name: Database migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: loom
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loom -d loom" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://loom:loom@localhost:5432/loom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --legacy-peer-deps
      - name: Apply all migrations to an empty database
        working-directory: web
        run: npx prisma migrate deploy
      - name: Schema matches the migrations
        working-directory: web
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  web:
    name: web — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma client
        working-directory: web
        run: npx prisma generate
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build

  scanner:
    name: scanner — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - name: Install dependencies
        working-directory: scanner
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma client
        working-directory: scanner
        run: npx prisma generate
      - name: Typecheck
        working-directory: scanner
        run: npx tsc --noEmit

  docker:
    name: Docker images build and start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Storage folders owned by the container user
        run: sudo mkdir -p data/media data/cache && sudo chown -R 1000:1000 data
      - name: Install with the real installer (non-interactive)
        run: ./scripts/install.sh --non-interactive
      - name: Scanner runs as the unprivileged user
        run: |
          users="$(docker compose exec -T loom-scanner sh -c "ps -o user,args | grep '[s]rc/index.ts' | awk '{print \$1}' | sort -u")"
          echo "scanner processes run as: $users"
          test "$users" = "node"
      - name: Health endpoint reports the version
        run: curl -fsS http://127.0.0.1:8085/api/health | grep -q "\"version\":\"$(cat VERSION)\""
      - name: Backup and verify
        run: ./scripts/backup-db.sh
      - name: Update script (check, then rebuild path)
        run: |
          git init --bare -q /tmp/upstream.git
          git push -q /tmp/upstream.git HEAD:refs/heads/main
          git remote add upstream /tmp/upstream.git
          git fetch -q upstream
          git checkout -q -B ci-main upstream/main
          ./scripts/update.sh --check
          ./scripts/update.sh --yes --rebuild
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200

  integration:
    name: Integration tests (API, browsers, desktop engine)
    runs-on: ubuntu-latest
    env:
      LOOM_TEST_DIR: ${{ github.workspace }}/.loomtest
      LOOM_TEST_URL: http://localhost:18085
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Start a disposable Loom (with LAN access)
        run: |
          # The containers run as uid 1000; the runner isn't.
          mkdir -p "$LOOM_TEST_DIR/media" "$LOOM_TEST_DIR/cache" && touch "$LOOM_TEST_DIR/.loomtest"
          sudo chown 1000:1000 "$LOOM_TEST_DIR/media" "$LOOM_TEST_DIR/cache"
          tests/stack/stack.sh up
      - name: Test dependencies
        working-directory: tests
        run: npm ci
      - name: API tests
        working-directory: tests
        run: npm run api
      - name: Browser tests (desktop, iPhone, Android phone and tablet)
        run: |
          docker compose -p loomtest -f tests/stack/compose.yml restart loom-web
          until curl -fs http://localhost:18085/api/health >/dev/null; do sleep 2; done
          tests/run-e2e.sh --reporter=line
      - name: Desktop transfer engine against the server
        working-directory: clients/desktop
        run: |
          docker compose -p loomtest -f ../../tests/stack/compose.yml restart loom-web
          until curl -fs http://localhost:18085/api/health >/dev/null; do sleep 2; done
          cargo test -p loom-engine -- --test-threads=2
      - name: Screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: tests/e2e-results
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose -p loomtest -f tests/stack/compose.yml logs --tail=300
