name: Loom for Android

on:
  push:
    branches: [main, dev, next]
    paths: ["clients/android/**", "brand/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  pull_request:
    paths: ["clients/android/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.11.1"
  LOOM_TEST_URL: http://localhost:18085
  LOOM_TEST_DIR: ${{ github.workspace }}/.loomtest

jobs:
  build:
    name: Build, lint and engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Start a test Loom
        working-directory: .
        run: |
          # The containers run as uid 1000; the runner isn't.
          mkdir -p "$LOOM_TEST_DIR/media" "$LOOM_TEST_DIR/cache" && touch "$LOOM_TEST_DIR/.loomtest"
          sudo chown 1000:1000 "$LOOM_TEST_DIR/media" "$LOOM_TEST_DIR/cache"
          # Docker Hub sometimes refuses pulls for a moment (429): try again.
          for i in 1 2 3; do tests/stack/stack.sh up && break; [ $i = 3 ] && exit 1; sleep 45; done
      - name: Engine tests (against the test Loom)
        run: gradle --no-daemon :engine:test
      - name: Release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key: the release APK is signed with the debug key"
          fi
      - name: Lint and build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: clients/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: loom-android-apk
          path: |
            clients/android/app/build/outputs/apk/release/*.apk
            clients/android/app/build/outputs/apk/debug/*.apk

  emulator:
    name: On ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "a phone, Android 14", api: 34, profile: pixel_6, target: google_apis }
          - { name: "a phone, Android 10", api: 29, profile: pixel_4, target: google_apis }
          - { name: "a tablet, Android 15", api: 35, profile: pixel_tablet, target: google_apis }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start a test Loom
        run: |
          mkdir -p "$LOOM_TEST_DIR/media" "$LOOM_TEST_DIR/cache" && touch "$LOOM_TEST_DIR/.loomtest"
          sudo chown 1000:1000 "$LOOM_TEST_DIR/media" "$LOOM_TEST_DIR/cache"
          # Docker Hub sometimes refuses pulls for a moment (429): try again.
          for i in 1 2 3; do tests/stack/stack.sh up && break; [ $i = 3 ] && exit 1; sleep 45; done
      - name: Build the app and its tests
        working-directory: clients/android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: clients/android
          script: bash ../../.github/scripts/android-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-api${{ matrix.api }}-${{ matrix.profile }}
          path: clients/android/screens
          if-no-files-found: warn

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: loom-android-apk
          path: dist
      - name: Create the GitHub release and point the app's update check at it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#android-v}"
          props=clients/android/app/version.properties
          name="$(sed -n 's/^versionName=//p' $props)"
          code="$(sed -n 's/^versionCode=//p' $props)"
          [ "$version" = "$name" ] || { echo "Tag $TAG doesn't match version.properties ($name)"; exit 1; }
          apk="$(ls dist/release/*.apk | head -1)"
          # A release must be signed with the real key, never the debug one.
          keytool -printcert -jarfile "$apk" | grep -q "Android Debug" && { echo "The APK is signed with the debug key: set the ANDROID_* secrets"; exit 1; }
          out="Loom-$version.apk"
          cp "$apk" "$out"
          awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' clients/android/CHANGELOG.md > notes.md
          { cat notes.md; echo; echo "Download $out on your phone or tablet and open it. Android asks to allow installing apps from your browser the first time. Installed copies update themselves."; } > release.md
          gh release create "$TAG" "$out" --repo "$GITHUB_REPOSITORY" --title "Loom for Android $version" --notes-file release.md
          jq -n --argjson code "$code" --arg v "$version" --rawfile notes notes.md \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$out" \
            --arg sha "$(sha256sum "$out" | cut -d' ' -f1)" \
            '{versionCode: $code, versionName: $v, url: $url, sha256: $sha, notes: $notes}' > android.json
          cat android.json
          gh release view updates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create updates --repo "$GITHUB_REPOSITORY" --prerelease --title "Update manifests" \
              --notes "Files the Loom apps read to find their updates, and the newest apps under fixed names (the download links on Loom's Devices page)."
          cp "$out" Loom-Android.apk
          gh release upload updates android.json Loom-Android.apk --clobber --repo "$GITHUB_REPOSITORY"
