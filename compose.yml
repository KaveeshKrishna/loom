services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loom
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Web App ─────────────────────────────────────────────────────────────────
  loom-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${LOOM_BIND:-127.0.0.1}:${LOOM_PORT:-8085}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://loom:${POSTGRES_PASSWORD}@postgres:5432/loom
    volumes:
      - ${LOOM_MEDIA_PATH:-./data/media}:/media
      - ${LOOM_CACHE_PATH:-./data/cache}:/cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Scanner ─────────────────────────────────────────────────────────────────
  loom-scanner:
    build:
      context: ./scanner
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://loom:${POSTGRES_PASSWORD}@postgres:5432/loom
    volumes:
      - ${LOOM_MEDIA_PATH:-./data/media}:/media
      - ${LOOM_CACHE_PATH:-./data/cache}:/cache
      # Share web's prisma schema for client generation
      - ./web/prisma:/app/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'tsx src/index.ts' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    driver: local
