services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: loom
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Web App ─────────────────────────────────────────────────────────────────
  loom-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging
    ports:
      - "${LOOM_BIND:-127.0.0.1}:${LOOM_PORT:-8085}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://loom:${POSTGRES_PASSWORD}@postgres:5432/loom
    volumes:
      - ${LOOM_MEDIA_PATH:-./data/media}:/media
      - ${LOOM_CACHE_PATH:-./data/cache}:/cache
      # The public certificate of the LAN service's authority (read-only),
      # handed to paired apps. Empty unless LAN access is on.
      - lan_public:/lan-pki:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Migrations run before the server starts; on a big library the first
      # start after an update can take a while.
      start_period: 120s

  # ── Scanner ─────────────────────────────────────────────────────────────────
  loom-scanner:
    build:
      context: ./scanner
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://loom:${POSTGRES_PASSWORD}@postgres:5432/loom
    volumes:
      - ${LOOM_MEDIA_PATH:-./data/media}:/media
      - ${LOOM_CACHE_PATH:-./data/cache}:/cache
      # Share web's prisma schema for client generation
      - ./web/prisma:/app/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'tsx src/index.ts' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── LAN access for the apps (optional) ─────────────────────────────────────
  # HTTPS on your local network so the desktop and mobile apps upload straight
  # to this machine at home. Turn it on with ./scripts/lan.sh enable — see
  # docs/CONFIGURATION.md → LAN access.
  loom-lan:
    image: caddy:2.11-alpine
    profiles: ["lan"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${LOOM_LAN_BIND:-127.0.0.1}:${LOOM_LAN_PORT:-8443}:8443"
    environment:
      LOOM_LAN_HOST: ${LOOM_LAN_HOST:-}
    # Publish the authority's public certificate for loom-web, then serve.
    command: ["sh", "-c", "cp /pki/public/root.crt /lan-public/root.crt && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    volumes:
      - ./lan/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LOOM_LAN_PKI_PATH:-./data/lan-pki}:/pki:ro
      - lan_public:/lan-public
      - lan_caddy:/data
    depends_on:
      loom-web:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  lan_public:
    driver: local
  lan_caddy:
    driver: local
