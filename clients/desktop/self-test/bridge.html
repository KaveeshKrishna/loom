<!doctype html>
<!--
  The page side of `Loom.exe --bridge-self-test` (see src-tauri/src/self_test.rs).
  Served over http://127.0.0.1 in CI; it plays Loom's web page and uses
  window.LoomApp the way web/lib/client/native.ts does.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loom bridge self-test</title>
</head>
<body>
  <div id="drop" style="position: fixed; left: 0; top: 0; right: 0; height: 60vh; border: 2px dashed #888; display: flex; align-items: center; justify-content: center; font: 14px system-ui">Drop here</div>
  <pre id="out" style="position: fixed; left: 0; right: 0; bottom: 0; height: 35vh; overflow: auto; margin: 0"></pre>
  <script>
    const out = (s) => (document.getElementById("out").textContent += s + "\n");
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const within = (p, ms) => Promise.race([p.then(() => "ok", (e) => "error: " + e.message), wait(ms).then(() => "no answer")]);

    async function main() {
      for (let i = 0; i < 200 && !window.LoomApp; i++) await wait(50);
      const app = window.LoomApp;
      if (!app) {
        out("no window.LoomApp (chrome.webview: " + !!(window.chrome && window.chrome.webview) + ")");
        return; // nothing to report through: the app times out
      }
      const fail = (m) => {
        out("FAIL " + m);
        app.log("error", "self-test: fail: " + m);
      };
      try {
        out("LoomApp " + app.apiVersion + " " + app.platform + " " + JSON.stringify(app.capabilities));
        if (app.apiVersion < 2) return fail("apiVersion " + app.apiVersion);
        // App → page: the app answers ready() with a transfers update.
        const update = new Promise((res) => addEventListener("loomapp:transfers", (e) => res(e.detail), { once: true }));
        app.ready();
        const t = await Promise.race([update, wait(10000).then(() => null)]);
        if (!t) return fail("no loomapp:transfers after ready()");
        out("transfers update: " + JSON.stringify(t));
        // Page → app → page: every request is acknowledged.
        const calls = [
          ["openTransfers", () => app.openTransfers()],
          ["openSettings", () => app.openSettings()],
          ["pickUpload", () => app.pickUpload("Docs", "files")],
          ["download", () => app.download({ items: [{ path: "Docs/a.txt", name: "a.txt", type: "FILE" }] })],
        ];
        for (const [name, call] of calls) {
          const r = await within(call(), 10000);
          out(name + ": " + r);
          if (r !== "ok") return fail(name + ": " + r);
        }
        app.setLocation({ path: "Docs", canWrite: true });

        // A real drop (the app sends it through the DevTools protocol): the
        // top-level items go to the app as File objects, like Loom's page does.
        const zone = document.getElementById("drop");
        const dropped = new Promise((resolve) => {
          zone.addEventListener("dragover", (e) => e.preventDefault());
          zone.addEventListener("drop", (e) => {
            e.preventDefault();
            const items = [];
            const files = [];
            for (const i of Array.from(e.dataTransfer.items)) {
              if (i.kind !== "file") continue;
              const entry = i.webkitGetAsEntry && i.webkitGetAsEntry();
              const file = i.getAsFile();
              if (!file) continue;
              items.push({ name: (entry && entry.name) || file.name, kind: entry && entry.isDirectory ? "folder" : "file" });
              files.push(file);
            }
            resolve({ items, files });
          });
        });
        const r = zone.getBoundingClientRect();
        app.log("info", `self-test: drop at ${Math.round(r.left + r.width / 2)},${Math.round(r.top + r.height / 2)}`);
        const drop = await Promise.race([dropped, wait(20000).then(() => null)]);
        if (!drop) return fail("nothing was dropped");
        out("dropped: " + JSON.stringify(drop.items));
        if (drop.files.length !== 2) return fail("expected 2 dropped items, got " + drop.files.length);
        const d = await within(app.uploadDropped("Drops", drop.items, drop.files), 10000);
        out("uploadDropped: " + d);
        if (d !== "ok") return fail("uploadDropped: " + d);

        app.log("info", "self-test: pass");
        out("done");
      } catch (e) {
        fail(String((e && e.stack) || e));
      }
    }
    main();
  </script>
</body>
</html>
